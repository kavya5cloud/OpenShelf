<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenShelf — My Shelf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="content" id="content">
    <div class="toolbar">
      <div class="segmented" role="tablist" aria-label="View">
        <button type="button" role="tab" id="tabShelves" aria-selected="true">Shelves</button>
        <button type="button" role="tab" id="tabAll" aria-selected="false">All books</button>
      </div>
      <div class="search">
        <span id="searchIcon"></span>
        <label for="q" class="sr-only">Search my shelf</label>
        <input class="input" id="q" type="search" placeholder="Search in my shelf">
      </div>
    </div>
    <div id="view" style="display:flex;flex-direction:column;gap:34px"></div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/audiobooks.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/library.js"></script>
</body>
</html>
