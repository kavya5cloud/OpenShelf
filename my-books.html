<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenShelf — My Books</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="content" id="content">
    <div class="page-head">
      <div class="titles"><h1>My books</h1><p class="muted" id="sub">Your loans, history and fines.</p></div>
    </div>
    <section class="grid stats" id="stats" aria-label="Summary"></section>
    <section class="card" aria-labelledby="curH">
      <div class="card-head"><h2 id="curH">Currently issued</h2><span class="hint" id="renewHint"></span></div>
      <div id="current" style="display:flex;flex-direction:column;gap:10px"></div>
    </section>
    <section class="card" aria-labelledby="histH">
      <div class="card-head"><h2 id="histH">Borrowing history</h2></div>
      <div class="table-wrap" id="history"></div>
    </section>
  </main>

  <script src="js/store.js"></script>
  <script src="js/audiobooks.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/my-books.js"></script>
</body>
</html>
