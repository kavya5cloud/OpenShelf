<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OpenShelf — Your campus library</title>
  <meta name="description" content="Search the catalog, reserve books, listen to audiobook summaries and keep track of due dates — for students, faculty and librarians.">
  <meta name="theme-color" content="#C4C1F5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <main class="hero">
    <div class="wrap">
      <nav class="nav" aria-label="Main">
        <a class="logo" href="index.html">
          <svg width="34" height="34" viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="11" fill="#0E0D14"/><path d="M11 13v14M16 11v16M21 13v14" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M25 12.5l5 13.5" stroke="#A9A5F7" stroke-width="3" stroke-linecap="round"/><path d="M9 29h22" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
          OpenShelf
        </a>
        <button class="pill" type="button" data-login>Log in <span class="arr"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
      </nav>

      <div class="notice" aria-live="polite">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true"><path d="M2 9h7M4 15h6M2 21h7" stroke="#0E0D14" stroke-width="2" stroke-linecap="round"/><path d="M19.5 3 12 16.5h6.5L16 27l9-13.5h-6.5L21 3z" fill="#0E0D14"/></svg>
        <div class="notice-body" id="notice"></div>
      </div>

      <h1 class="headline">The Whole Library, In Your Pocket</h1>

      <div class="shelf-head">
        <h2 id="shelfTitle">All books</h2>
        <div class="stepper">
          <button type="button" id="prevCat" aria-label="Previous category"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
          <span id="shelfCount">0 books</span>
          <button type="button" id="nextCat" aria-label="Next category"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>
    </div>

    <div class="shelf">
      <ul class="shelf-row" id="shelf" aria-label="Books on the shelf"></ul>
      <div class="ledge" aria-hidden="true"></div>
    </div>

    <div class="wrap">
      <div class="tabs" id="tabs" aria-label="Filter shelf by subject"></div>
    </div>

    <section class="sheet wrap" aria-labelledby="featTitle">
      <div class="feature">
        <div>
          <div class="chips"><span>Collections</span><span>Books</span></div>
          <h3 id="featTitle">Autumn Reads</h3>
          <p class="sub">The Most Borrowed Books</p>
          <div class="big"><strong id="loanCount">0</strong><small>Loans</small></div>
        </div>
        <ul class="grid4" id="topBooks" aria-label="Most borrowed books"></ul>
      </div>
      <div class="cta">
        <button class="pill lg" type="button" data-login id="ctaBtn">Log in to borrow <span class="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
        <p>For students, faculty and librarians — sign in with your college ID.</p>
      </div>
    </section>
  </main>

  <dialog class="login" id="login" aria-labelledby="loginTitle">
    <form id="loginForm" novalidate>
      <div class="grab" aria-hidden="true"></div>
      <div class="login-top">
        <div>
          <h2 id="loginTitle">Welcome back</h2>
          <p class="lead">Choose your role and log in with your college ID.</p>
        </div>
        <button class="x" type="button" id="closeLogin" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>

      <div class="seg" id="rolePick" role="group" aria-label="I am a">
        <button type="button" data-role="librarian" aria-pressed="false">Librarian</button>
        <button type="button" data-role="student" aria-pressed="true">Student</button>
        <button type="button" data-role="faculty" aria-pressed="false">Faculty</button>
      </div>

      <div class="field">
        <label for="uid" id="uidLabel">Enrollment number</label>
        <input id="uid" name="uid" autocomplete="username" placeholder="e.g. 24BCS001" required>
      </div>
      <div class="field">
        <label for="pwd">Password</label>
        <input id="pwd" name="pwd" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <p class="err" id="loginError" role="alert" hidden></p>
      <button class="pill lg" type="submit" id="loginBtn"><span id="loginBtnText">Log in as Student</span> <span class="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>

      <div class="demo" id="demoBox"></div>
    </form>
  </dialog>

  <script src="js/store.js"></script>
  <script src="js/audiobooks.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
  (function () {
    const $ = OS.$, esc = OS.esc;
    const me = OS.session.get();
    const db = OS.db();
    const books = db.books;
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ---------- data for the page ----------
    const loans = {};
    db.transactions.forEach((t) => { loans[t.bookId] = (loans[t.bookId] || 0) + 1; });
    const popular = books.slice().sort((a, b) => (loans[b.id] || 0) - (loans[a.id] || 0));
    const cats = ['All', ...new Set(books.map((b) => b.category))];
    const inCat = (c) => (c === 'All' ? popular : popular.filter((b) => b.category === c));
    const m = new Date().getMonth();
    const season = m >= 2 && m <= 4 ? 'Spring' : m >= 5 && m <= 7 ? 'Summer' : m >= 8 && m <= 10 ? 'Autumn' : 'Winter';

    // ---------- covers ----------
    const LOOKS = ['blocks', 'giant', 'serif', 'night', 'poster'];
    function cover(b, i) {
      const title = String(b.title), author = String(b.author || '').split(',')[0];
      const longest = Math.max(...title.split(/\s+/).map((w) => w.length));
      const img = OS.coversOnline && b.isbn
        ? `<img class="cover-img" src="https://covers.openlibrary.org/b/isbn/${encodeURIComponent(b.isbn)}-L.jpg?default=false" alt="" loading="lazy">`
        : '';
      return `<div class="bk bk-${LOOKS[i % LOOKS.length]}" style="--c:${esc(b.color || '#5F5BC4')};--fs:${Math.min(34, Math.round(260 / longest))}cqi" role="img" aria-label="${esc(title)} by ${esc(author)}">
        <div class="bk-face"><i class="bk-art"></i><span class="bk-t">${esc(title)}</span><span class="bk-a">${esc(author)}</span></div>${img}
      </div>`;
    }

    // ---------- headline, shelf, tabs ----------
    $('#tabs').innerHTML = cats.map((c) => `<button type="button" data-cat="${esc(c)}" aria-pressed="false">${esc(c)} <span class="count">${inCat(c).length}</span></button>`).join('');
    let cat = 'All';
    function setCat(c) {
      cat = c;
      const list = inCat(c);
      $('#shelfTitle').textContent = c === 'All' ? 'All books' : c;
      $('#shelfCount').textContent = `${list.length} book${list.length === 1 ? '' : 's'}`;
      $('#shelf').innerHTML = list.map((b, i) => `<li style="--i:${i}">${cover(b, books.indexOf(b))}</li>`).join('');
      $('#shelf').scrollTo({ left: 0 });
      OS.$$('#tabs button').forEach((t) => t.setAttribute('aria-pressed', String(t.dataset.cat === c)));
    }
    OS.$$('#tabs button').forEach((t) => t.addEventListener('click', () => setCat(t.dataset.cat)));
    const step = (d) => setCat(cats[(cats.indexOf(cat) + d + cats.length) % cats.length]);
    $('#prevCat').addEventListener('click', () => step(-1));
    $('#nextCat').addEventListener('click', () => step(1));
    setCat('All');

    // ---------- featured sheet ----------
    $('#featTitle').textContent = season + ' Reads';
    $('#topBooks').innerHTML = popular.slice(0, 4).map((b) => `<li>${cover(b, books.indexOf(b))}</li>`).join('');
    const total = db.transactions.length;
    if (still) $('#loanCount').textContent = total;
    else {
      const t0 = performance.now();
      const tick = (t) => {
        const k = Math.min(1, (t - t0) / 1400);
        $('#loanCount').textContent = Math.round(total * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    // ---------- rotating notice ----------
    const notes = [
      [`${Object.keys(OS.AUDIOBOOKS).length} audiobook summaries, ready to play`, 'Listen along with highlighted read-along text'],
      [`${books.length} titles across ${cats.length - 1} subjects`, 'Search, reserve and track every due date'],
      [`${total} loans and counting`, 'Join the students and faculty already reading']
    ];
    $('#notice').innerHTML = notes.map((n, i) => `<div class="notice-item" aria-hidden="${i !== 0}"><b>${esc(n[0])}</b><span>${esc(n[1])}</span></div>`).join('');
    let ni = 0;
    setInterval(() => {
      if (document.hidden) return;
      ni = (ni + 1) % notes.length;
      OS.$$('#notice .notice-item').forEach((el, i) => el.setAttribute('aria-hidden', String(i !== ni)));
    }, 4500);

    // ---------- signed in already: send them to the app ----------
    if (me) {
      if (location.hash === '#login') { location.replace('dashboard.html'); return; }
      OS.$$('[data-login]').forEach((b) => {
        b.firstChild.textContent = b.id === 'ctaBtn' ? 'Open your dashboard ' : 'Dashboard ';
        b.addEventListener('click', () => { location.href = 'dashboard.html'; });
      });
      return;
    }

    // ---------- login sheet ----------
    const dlg = $('#login');
    function openLogin() {
      if (dlg.open) return;
      dlg.showModal();
      if (location.hash !== '#login') history.replaceState(null, '', '#login');
      setTimeout(() => $('#uid').focus(), 60);
    }
    function closeLogin() { dlg.close(); }
    dlg.addEventListener('close', () => { if (location.hash === '#login') history.replaceState(null, '', location.pathname); });
    dlg.addEventListener('click', (e) => { if (e.target === dlg) closeLogin(); }); // tap on the backdrop
    $('#closeLogin').addEventListener('click', closeLogin);
    OS.$$('[data-login]').forEach((b) => b.addEventListener('click', openLogin));
    window.addEventListener('hashchange', () => { if (location.hash === '#login') openLogin(); });

    const CFG = {
      librarian: { label: 'Staff ID', ph: 'e.g. LIB-001', demo: ['LIB-001', 'admin123'] },
      student: { label: 'Enrollment number', ph: 'e.g. 24BCS001', demo: ['24BCS001', 'student123'] },
      faculty: { label: 'Faculty ID', ph: 'e.g. FAC-1024', demo: ['FAC-1024', 'faculty123'] }
    };
    let role = 'student';

    function setRole(r) {
      role = r;
      OS.$$('#rolePick button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.role === r)));
      $('#uidLabel').textContent = CFG[r].label;
      $('#uid').placeholder = CFG[r].ph;
      $('#loginBtnText').textContent = 'Log in as ' + OS.roleLabel(r);
      $('#demoBox').innerHTML = `<span>Demo: <code>${CFG[r].demo[0]}</code> / <code>${CFG[r].demo[1]}</code></span><button type="button" id="fillDemo">Fill it</button>`;
      $('#fillDemo').addEventListener('click', () => { $('#uid').value = CFG[r].demo[0]; $('#pwd').value = CFG[r].demo[1]; $('#pwd').focus(); });
      $('#loginError').hidden = true;
    }
    OS.$$('#rolePick button').forEach((b) => b.addEventListener('click', () => setRole(b.dataset.role)));
    setRole('student');

    $('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = $('#loginError');
      err.hidden = true;
      const id = $('#uid').value.trim(), pwd = $('#pwd').value;
      if (!id || !pwd) { err.textContent = 'Please enter your ID and password.'; err.hidden = false; return; }
      try {
        const user = await OS.api.login(id, pwd, role);
        OS.session.set(user);
        location.href = 'dashboard.html';
      } catch (ex) {
        err.textContent = ex.message; err.hidden = false;
      }
    });

    if (location.hash === '#login') openLogin();
  })();
  </script>
</body>
</html>
